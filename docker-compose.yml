version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model:ro
      - ./data:/app/data:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      # You can add GOOGLE_CLOUD_PROJECT here for Vertex AI integration if needed
      ## TODO: Remove if not using Vertex AI
      - PORT=8000
    networks:
      - local-network

  locust:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    command: -f /mnt/locust/locustfile.py --host http://api:8000
    networks:
      - local-network
    depends_on:
      api:
        condition: service_healthy

networks:
  local-network:
    driver: bridge
